<style>
  /* Loading Screen Styling */
  #loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #0d0d0d; /* Matches dark theme background */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999999; /* Stay on top of everything */
    transition: opacity 0.3s ease-out; /* Smooth fade out */
    color: #888888;
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px;
  }

  /* Lightweight CSS Spinner */
  .spinner {
    width: 32px;
    height: 32px;
    margin-bottom: 12px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #3b82f6; /* Accent color */
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
